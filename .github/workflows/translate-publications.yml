name: Translate published articles

on:
  push:
    branches:
      - main
    paths:
      - src/content/blog/**
      - scripts/translate.mjs
      - scripts/translate-provider.mjs
      - scripts/translation-plan.mjs
      - scripts/publish-translation.mjs
      - scripts/translation-cli-smoke.mjs
      - scripts/test-protected-syntax.mjs
      - scripts/test-translation-provider.mjs
      - scripts/test-translation-scheduler.mjs
      - scripts/test-translation-validation.mjs
      - .github/workflows/translate-publications.yml
  workflow_dispatch:
    inputs:
      slug:
        description: Optional French source slug
        required: false
        type: string
      locale:
        description: Optional target locale (en, es or de)
        required: false
        type: string
      force:
        description: Regenerate a current automatic translation
        required: false
        type: boolean
        default: false
      reconcile:
        description: Plan every missing or stale automatic translation
        required: false
        type: boolean
        default: false
      smoke:
        description: Run one authenticated integration fixture only
        required: false
        type: boolean
        default: false
      validation:
        description: Generate selected translations without publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      has_work: ${{ steps.plan.outputs.has_work }}
      matrix: ${{ steps.plan.outputs.matrix }}
      engine_changed: ${{ steps.changes.outputs.engine_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Detect translation engine changes
        id: changes
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "engine_changed=false" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "$AFTER" -- scripts/translate.mjs scripts/translate-provider.mjs scripts/translation-plan.mjs scripts/publish-translation.mjs scripts/translation-cli-smoke.mjs scripts/test-protected-syntax.mjs scripts/test-translation-provider.mjs scripts/test-translation-scheduler.mjs scripts/test-translation-validation.mjs; then
            echo "engine_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "engine_changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Plan translation units
        id: plan
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          TRANSLATE_SLUG: ${{ inputs.slug }}
          TRANSLATE_LOCALE: ${{ inputs.locale }}
          TRANSLATE_FORCE: ${{ inputs.force }}
          TRANSLATE_RECONCILE: ${{ inputs.reconcile }}
          TRANSLATE_SMOKE: ${{ inputs.smoke }}
          TRANSLATE_VALIDATION: ${{ inputs.validation }}
        run: |
          args=(--github-output "$GITHUB_OUTPUT")
          if [[ "$TRANSLATE_SMOKE" == "true" ]]; then
            args+=(--empty)
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            args+=(--before "$BEFORE" --after "$AFTER")
          else
            if [[ "$TRANSLATE_VALIDATION" == "true" && -z "$TRANSLATE_SLUG" ]]; then
              echo "Validation requires a source slug." >&2
              exit 1
            fi
            if [[ -n "$TRANSLATE_SLUG" ]]; then args+=(--slug "$TRANSLATE_SLUG"); fi
            if [[ -n "$TRANSLATE_LOCALE" ]]; then args+=(--locale "$TRANSLATE_LOCALE"); fi
            if [[ "$TRANSLATE_FORCE" == "true" ]]; then args+=(--force); fi
            if [[ "$TRANSLATE_RECONCILE" == "true" || -z "$TRANSLATE_SLUG" ]]; then args+=(--reconcile); fi
          fi
          node scripts/translation-plan.mjs "${args[@]}"

  translate:
    if: needs.plan.outputs.has_work == 'true'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: translation-${{ matrix.slug }}-${{ matrix.locale }}
      cancel-in-progress: true
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.validation && github.ref_name || 'main' }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Refresh translation unit
        id: refresh
        shell: bash
        env:
          SLUG: ${{ matrix.slug }}
          LOCALE: ${{ matrix.locale }}
          FORCE: ${{ matrix.force }}
        run: |
          args=(--slug "$SLUG" --locale "$LOCALE" --github-output "$GITHUB_OUTPUT")
          if [[ "$FORCE" == "true" ]]; then args+=(--force); fi
          node scripts/translation-plan.mjs "${args[@]}"
      - name: Install translation runtime
        if: steps.refresh.outputs.action == 'translate'
        run: |
          npm install --global opencode-ai@1.18.30
          opencode --version
      - name: Generate one translation
        if: steps.refresh.outputs.action == 'translate'
        shell: bash
        env:
          SLUG: ${{ matrix.slug }}
          LOCALE: ${{ matrix.locale }}
          FORCE: ${{ matrix.force }}
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
          TRANSLATION_MODEL: ${{ vars.TRANSLATION_MODEL }}
        run: |
          args=(--translate --slug "$SLUG" --locale "$LOCALE")
          if [[ "$FORCE" == "true" ]]; then args+=(--force); fi
          npm run translate -- "${args[@]}"
          npm run translate -- --assert-current --slug "$SLUG" --locale "$LOCALE"
      - name: Publish completed locale
        id: publish
        if: steps.refresh.outputs.has_work == 'true' && !inputs.validation
        shell: bash
        env:
          SLUG: ${{ matrix.slug }}
          LOCALE: ${{ matrix.locale }}
          ACTION: ${{ steps.refresh.outputs.action }}
        run: node scripts/publish-translation.mjs --slug "$SLUG" --locale "$LOCALE" --action "$ACTION" --github-output "$GITHUB_OUTPUT"
      - name: Request latest production deployment
        if: steps.publish.outputs.result == 'pushed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
      - name: Preserve validation output
        if: inputs.validation && steps.refresh.outputs.action == 'translate'
        uses: actions/upload-artifact@v6
        with:
          name: validation-${{ matrix.slug }}-${{ matrix.locale }}
          path: src/content/translations/${{ matrix.locale }}/${{ matrix.slug }}.*
          if-no-files-found: error
          retention-days: 1
      - name: Summarize locale
        if: always()
        shell: bash
        env:
          SLUG: ${{ matrix.slug }}
          LOCALE: ${{ matrix.locale }}
          ACTION: ${{ steps.refresh.outputs.action }}
        run: |
          echo "### $SLUG" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$LOCALE: $ACTION — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  quality:
    if: inputs.smoke || needs.plan.outputs.engine_changed == 'true'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run translation tests
        run: |
          npm run test:protected-syntax
          npm run test:translation-provider
          npm run test:translation-validation
          npm run test:translation-scheduler

  integration:
    if: inputs.smoke
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install translation runtime
        run: |
          npm install --global opencode-ai@1.18.30
          opencode --version
      - name: Run authenticated integration fixture
        env:
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
          TRANSLATION_MODEL: ${{ vars.TRANSLATION_MODEL }}
        run: npm run test:translation-integration
