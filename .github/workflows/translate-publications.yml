name: Translate published articles

on:
  push:
    branches:
      - main
    paths:
      - src/content/blog/**
      - scripts/translate.mjs
      - scripts/translate-provider.mjs
      - scripts/translation-plan.mjs
      - scripts/translation-worker.py
      - scripts/publish-translation.mjs
      - scripts/test-translation-scheduler.mjs
      - requirements-translation.txt
      - .github/workflows/translate-publications.yml
  workflow_dispatch:
    inputs:
      slug:
        description: Optional French source slug
        required: false
        type: string
      locale:
        description: Optional target locale (en, es or de)
        required: false
        type: string
      force:
        description: Regenerate a current automatic translation
        required: false
        type: boolean
        default: false
      reconcile:
        description: Plan every missing or stale automatic translation
        required: false
        type: boolean
        default: false
      smoke:
        description: Run the full TranslateGemma quality suite only
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      has_work: ${{ steps.plan.outputs.has_work }}
      matrix: ${{ steps.plan.outputs.matrix }}
      engine_changed: ${{ steps.changes.outputs.engine_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Detect translation engine changes
        id: changes
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "engine_changed=false" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "$AFTER" -- scripts/translate.mjs scripts/translate-provider.mjs scripts/translation-plan.mjs scripts/translation-worker.py scripts/publish-translation.mjs requirements-translation.txt; then
            echo "engine_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "engine_changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Plan translation units
        id: plan
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          TRANSLATE_SLUG: ${{ inputs.slug }}
          TRANSLATE_LOCALE: ${{ inputs.locale }}
          TRANSLATE_FORCE: ${{ inputs.force }}
          TRANSLATE_RECONCILE: ${{ inputs.reconcile }}
          TRANSLATE_SMOKE: ${{ inputs.smoke }}
        run: |
          args=(--github-output "$GITHUB_OUTPUT")
          if [[ "$TRANSLATE_SMOKE" == "true" ]]; then
            args+=(--empty)
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            args+=(--before "$BEFORE" --after "$AFTER")
          else
            if [[ -n "$TRANSLATE_SLUG" ]]; then args+=(--slug "$TRANSLATE_SLUG"); fi
            if [[ -n "$TRANSLATE_LOCALE" ]]; then args+=(--locale "$TRANSLATE_LOCALE"); fi
            if [[ "$TRANSLATE_FORCE" == "true" ]]; then args+=(--force); fi
            if [[ "$TRANSLATE_RECONCILE" == "true" || -z "$TRANSLATE_SLUG" ]]; then args+=(--reconcile); fi
          fi
          node scripts/translation-plan.mjs "${args[@]}"

  translate:
    if: needs.plan.outputs.has_work == 'true'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: translation-${{ matrix.slug }}-${{ matrix.locale }}
      cancel-in-progress: true
    env:
      TRANSLATION_CACHE_DIR: ${{ github.workspace }}/.translation-cache
      TRANSLATEGEMMA_THREADS: "2"
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Refresh translation unit
        id: refresh
        shell: bash
        env:
          SLUG: ${{ matrix.slug }}
          LOCALE: ${{ matrix.locale }}
          FORCE: ${{ matrix.force }}
        run: |
          args=(--slug "$SLUG" --locale "$LOCALE" --github-output "$GITHUB_OUTPUT")
          if [[ "$FORCE" == "true" ]]; then args+=(--force); fi
          node scripts/translation-plan.mjs "${args[@]}"
      - name: Setup Python
        if: steps.refresh.outputs.action == 'translate'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-translation.txt
      - name: Restore model cache
        if: steps.refresh.outputs.action == 'translate'
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.translation-cache
          key: translategemma-4b-q4_k_m-b10948-${{ runner.os }}-cd39c30302f20fb8b788234d86a0a35a0d050619-526747309109c016
          restore-keys: |
            translategemma-4b-q4_k_m-b10948-${{ runner.os }}-
      - name: Install translation dependencies
        if: steps.refresh.outputs.action == 'translate'
        run: python -m pip install -r requirements-translation.txt
      - name: Generate one translation
        if: steps.refresh.outputs.action == 'translate'
        shell: bash
        env:
          SLUG: ${{ matrix.slug }}
          LOCALE: ${{ matrix.locale }}
          FORCE: ${{ matrix.force }}
        run: |
          args=(--translate --slug "$SLUG" --locale "$LOCALE")
          if [[ "$FORCE" == "true" ]]; then args+=(--force); fi
          npm run translate -- "${args[@]}"
          npm run translate -- --assert-current --slug "$SLUG" --locale "$LOCALE"
      - name: Publish completed locale
        if: steps.refresh.outputs.has_work == 'true'
        shell: bash
        env:
          SLUG: ${{ matrix.slug }}
          LOCALE: ${{ matrix.locale }}
          ACTION: ${{ steps.refresh.outputs.action }}
        run: node scripts/publish-translation.mjs --slug "$SLUG" --locale "$LOCALE" --action "$ACTION"
      - name: Summarize locale
        if: always()
        shell: bash
        env:
          SLUG: ${{ matrix.slug }}
          LOCALE: ${{ matrix.locale }}
          ACTION: ${{ steps.refresh.outputs.action }}
        run: |
          echo "### $SLUG" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$LOCALE: $ACTION — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  quality:
    if: inputs.smoke || needs.plan.outputs.engine_changed == 'true'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TRANSLATION_CACHE_DIR: ${{ github.workspace }}/.translation-cache
      TRANSLATEGEMMA_THREADS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-translation.txt
      - name: Restore model cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.translation-cache
          key: translategemma-4b-q4_k_m-b10948-${{ runner.os }}-cd39c30302f20fb8b788234d86a0a35a0d050619-526747309109c016
          restore-keys: |
            translategemma-4b-q4_k_m-b10948-${{ runner.os }}-
      - name: Install translation dependencies
        run: python -m pip install -r requirements-translation.txt
      - name: Run TranslateGemma quality suite
        run: python scripts/translation-worker.py --quality-test
