name: Translate published articles

on:
  push:
    branches:
      - main
    paths:
      - src/content/blog/**
  workflow_dispatch:
    inputs:
      slug:
        description: Optional French source slug
        required: false
        type: string
      locale:
        description: Optional target locale (en, es, de, pt-br, it, ja or zh-cn)
        required: false
        type: string
      force:
        description: Regenerate current automatic translations
        required: false
        type: boolean
        default: false
      smoke:
        description: Run a local engine smoke test only (no commit, no deploy)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: translations-main
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    outputs:
      generated: ${{ steps.changes.outputs.generated }}
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      M2M100_BATCH: "4"
      M2M100_THREADS: "2"
      TRANSLATE_SLUG: ${{ inputs.slug }}
      TRANSLATE_LOCALE: ${{ inputs.locale }}
      TRANSLATE_FORCE: ${{ inputs.force }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-translation.txt
      - name: Restore model cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.hf-cache
          key: m2m100-${{ runner.os }}-55c2e61bbf05dfb8d7abccdc3fae6fc8512fd636-${{ hashFiles('requirements-translation.txt') }}
          restore-keys: |
            m2m100-${{ runner.os }}-55c2e61bbf05dfb8d7abccdc3fae6fc8512fd636-
      - name: Install translation dependencies
        run: python -m pip install -r requirements-translation.txt
      - name: Validate translation engine
        run: python scripts/translation-worker.py --self-test
      - name: Sync main
        if: ${{ !inputs.smoke }}
        run: git pull --rebase origin main
      - name: Create smoke fixture
        if: ${{ inputs.smoke }}
        shell: bash
        run: |
          cat > src/content/blog/zz-smoke-check.md <<'EOF'
          ---
          title: Fumée de validation éphémère
          description: Un article minuscule pour contrôler le moteur local
          pubDate: 2026-09-01
          draft: false
          section: computing
          contentType: article
          tags:
            - validation
          ---

          ## Contrôle rapide

          Ce texte bref vérifie que le moteur local traduit la prose et préserve la structure.

          Voici un lien vers [la documentation Astro](https://docs.astro.build) et du code en ligne `const exemple = 1`.

          ```js
          const garde = "ce bloc doit rester intact";
          ```

          Une formule en ligne $E = mc^2$ doit rester intacte.

          > Une citation à traduire avec soin.
          EOF
      - name: Generate translations
        if: ${{ !inputs.smoke }}
        shell: bash
        run: |
          args=(--translate)
          if [[ -n "$TRANSLATE_SLUG" ]]; then args+=(--slug "$TRANSLATE_SLUG"); fi
          if [[ -n "$TRANSLATE_LOCALE" ]]; then args+=(--locale "$TRANSLATE_LOCALE"); fi
          if [[ "$TRANSLATE_FORCE" == "true" ]]; then args+=(--force); fi
          npm run translate -- "${args[@]}"
      - name: Smoke translation
        if: ${{ inputs.smoke }}
        shell: bash
        run: npm run translate -- --translate --slug zz-smoke-check
      - name: Validate smoke output
        if: ${{ inputs.smoke }}
        shell: bash
        run: |
          node -e '
            const { existsSync, readFileSync } = require("node:fs");
            const { join } = require("node:path");
            const locales = ["en", "es", "de", "pt-br", "it", "ja", "zh-cn"];
            const required = ["```js", "const garde = \"ce bloc doit rester intact\"", "https://docs.astro.build", "$E = mc^2$", "> "];
            for (const locale of locales) {
              const path = join("src", "content", "translations", locale, "zz-smoke-check.md");
              if (!existsSync(path)) throw new Error(`missing smoke output: ${path}`);
              const text = readFileSync(path, "utf8");
              for (const token of required) {
                if (!text.includes(token)) throw new Error(`${locale}: protected token lost: ${token}`);
              }
              if (!text.includes("sourceHash:") || text.includes("manual: true")) {
                throw new Error(`${locale}: translation metadata is incomplete`);
              }
            }
            console.log("Smoke output is structurally intact for all seven locales.");
          '
      - name: Remove smoke artifacts
        if: ${{ inputs.smoke }}
        shell: bash
        run: |
          rm -f src/content/blog/zz-smoke-check.md
          for locale in en es de pt-br it ja zh-cn; do
            rm -f "src/content/translations/$locale/zz-smoke-check.md"
          done
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --porcelain
            echo "Smoke test left workspace changes behind."
            exit 1
          fi
          echo "Smoke workspace is clean; nothing committed, nothing deployed."
      - name: Detect generated files
        if: ${{ !inputs.smoke }}
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- src/content/translations)" ]]; then
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check
        if: ${{ !inputs.smoke && steps.changes.outputs.generated == 'true' }}
        run: npm run check
      - name: Build
        if: ${{ !inputs.smoke && steps.changes.outputs.generated == 'true' }}
        run: npm run build
      - name: Verify production output
        if: ${{ !inputs.smoke && steps.changes.outputs.generated == 'true' }}
        run: npm run verify
      - name: Commit translations
        if: ${{ !inputs.smoke && steps.changes.outputs.generated == 'true' }}
        shell: bash
        run: |
          git config user.name "Voldigoade"
          git config user.email "245930475+Voldigoade@users.noreply.github.com"
          git add src/content/translations
          git commit -m "Publish article translations"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
      - name: Refresh production output
        if: ${{ !inputs.smoke && steps.changes.outputs.generated == 'true' }}
        run: |
          npm run build
          npm run verify
      - name: Configure Pages
        if: ${{ !inputs.smoke && steps.changes.outputs.generated == 'true' }}
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: ${{ !inputs.smoke && steps.changes.outputs.generated == 'true' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: needs.translate.outputs.generated == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: translate
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
