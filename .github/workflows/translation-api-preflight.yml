name: Translation API preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate HTTP client
        run: node scripts/test-translation-http.mjs
      - name: Authenticate and translate a tiny fixture
        env:
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
          TRANSLATION_API_ENDPOINT: ${{ vars.TRANSLATION_API_ENDPOINT }}
          TRANSLATION_MODEL: ${{ vars.TRANSLATION_MODEL }}
        run: node scripts/translation-api-smoke.mjs
